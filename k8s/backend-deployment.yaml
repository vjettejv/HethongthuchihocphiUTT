apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpm-backend-deploy
  namespace: cnpm-prod
  labels:
    app: cnpm-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cnpm-backend
  template:
    metadata:
      labels:
        app: cnpm-backend
    spec:
      containers:
        - name: backend
          image: vjettejv/cnpm-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2